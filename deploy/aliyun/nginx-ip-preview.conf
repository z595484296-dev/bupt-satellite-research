# Temporary IP preview. Configure the domain and HTTPS after approval.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.93.3.125;
    server_tokens off;
    client_max_body_size 12m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Keep administrator credentials off the public HTTP connection.
    # Access via an SSH tunnel to the loopback application port until HTTPS.
    location ~ ^/(admin(?:/|$)|api/admin(?:/|$)) {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:\.env|\.git|\.runtime|data|server|node_modules|package(?:-lock)?\.json)(?:/|$|\.) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
