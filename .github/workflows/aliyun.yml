name: Test and deploy to Aliyun

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend and sync tests
        run: npm test
      - name: Build website
        run: npm run build
      - name: Run Sites compatibility tests
        run: npm run test:sites
      - name: Record release version
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/client/deploy-version.json", JSON.stringify({commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString()}));'
      - name: Deploy to Aliyun and check public release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HOST }}
          DEPLOY_KEY: ${{ secrets.ALIYUN_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_command=(ssh -i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20 \
            satellite-deploy@"$DEPLOY_HOST")
          "${ssh_command[@]}" manifest > "$RUNNER_TEMP/server-manifest.json"
          node scripts/prepare-aliyun-package.mjs "$RUNNER_TEMP/server-manifest.json" "$RUNNER_TEMP/deploy-files.list"
          tar -czf "$RUNNER_TEMP/website.tar.gz" --null -T "$RUNNER_TEMP/deploy-files.list"
          "${ssh_command[@]}" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/website.tar.gz"
          curl --fail --silent --show-error --retry 3 "http://$DEPLOY_HOST/deploy-version.json" > "$RUNNER_TEMP/live-version.json"
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/live-version.json")); if(v.commit!==process.env.GITHUB_SHA) throw new Error("Public release does not match commit"); console.log("Verified public release:",v.commit);'
