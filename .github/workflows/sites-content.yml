name: Sync public content to Sites

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-content-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.SITES_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sites-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
      - name: Refresh published articles and media
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
          SITES_READ_KEY: ${{ secrets.SITES_READ_KEY }}
          SITES_SYNC_TOKEN: ${{ secrets.SITES_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          export SSH_KEY_FILE="$dir/key" SSH_HOSTS_FILE="$dir/known_hosts"
          printf '%s\n' "$SITES_READ_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" > "$SSH_HOSTS_FILE"
          unset SITES_READ_KEY ALIYUN_KNOWN_HOSTS
          node scripts/sync-sites-content.mjs
